<text x="40" y="535" class="sm">Lifecycle-enabling functions</text>
<rect x="170" y="565" width="330" height="160" rx="13" class="violet"/><rect x="188" y="583" width="75" height="26" rx="13" class="chip"/><text x="225" y="601" text-anchor="middle" class="id">FUN-007</text><text x="335" y="638" text-anchor="middle" class="h">Control configuration</text><text x="335" y="672" text-anchor="middle" class="t">hardware · software · settings · data</text><text x="335" y="700" text-anchor="middle" class="t">as-tested state / change history</text>
<rect x="555" y="565" width="330" height="160" rx="13" class="green"/><rect x="573" y="583" width="75" height="26" rx="13" class="chip"/><text x="610" y="601" text-anchor="middle" class="id">FUN-011</text><text x="720" y="638" text-anchor="middle" class="h">Verify installed aircraft</text><text x="720" y="672" text-anchor="middle" class="t">ground / flight verification</text><text x="720" y="700" text-anchor="middle" class="t">discrepancy → disposition → re-test</text>
<rect x="940" y="565" width="330" height="160" rx="13" class="green"/><rect x="958" y="583" width="75" height="26" rx="13" class="chip"/><text x="995" y="601" text-anchor="middle" class="id">FUN-012</text><text x="1105" y="638" text-anchor="middle" class="h">Sustain &amp; support</text><text x="1105" y="672" text-anchor="middle" class="t">LRU replacement / repair / spares</text><text x="1105" y="700" text-anchor="middle" class="t">configuration restoration · OEM loop</text>
