name: Systems-model quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate traceability, links and image paths
        run: python tools/validate_model.py

      - name: Build graph-ready digital thread
        run: python tools/export_digital_thread.py --output /tmp/digital-thread.json
