<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1440 980" preserveAspectRatio="xMidYMid meet">
<style>.title{font:700 34px Arial,sans-serif;fill:#111827}.sub{font:17px Arial,sans-serif;fill:#4b5563}.h{font:700 19px Arial,sans-serif;fill:#111827}.t{font:16px Arial,sans-serif;fill:#374151}.sm{font:14px Arial,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#475569;stroke-width:2}.blue{fill:#eff6ff;stroke:#315b8c;stroke-width:2.5}.green{fill:#f0fdf4;stroke:#3f7c52;stroke-width:2.5}.violet{fill:#f5f3ff;stroke:#6554a1;stroke-width:2.5}.slate{fill:#f8fafc;stroke:#64748b;stroke-width:2}.strong{stroke:#334155;stroke-width:2.4;fill:none}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 6}</style>
<rect width="1440" height="980" fill="white"/><text x="40" y="52" class="title">Retrofit Systems-Engineering V-Model</text><text x="40" y="82" class="sub">Retrospective engineering view: left side defines the solution; right side closes evidence against the identified configuration.</text>
