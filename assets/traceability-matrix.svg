<text x="70" y="1070" class="h">Interpretation</text>
<text x="70" y="1110" class="su">The matrix is intentionally sparse where evidence is sparse. It demonstrates traceability without inventing tests simply to fill cells.</text>
<text x="70" y="1145" class="su">Verification records remain tied to configuration states CFG-D1 / CFG-D2 / CFG-D3 / CFG-G1 and evidence IDs in the structured model.</text>
