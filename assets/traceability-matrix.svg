<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220">
<defs><style>
.ti{font:700 40px Arial,sans-serif;fill:#111827}.su{font:22px Arial,sans-serif;fill:#4b5563}
.h{font:700 20px Arial,sans-serif;fill:#111827}.r{font:19px Arial,sans-serif;fill:#111827}.s{font:17px Arial,sans-serif;fill:#4b5563}
.grid{stroke:#9ca3af;stroke-width:1}.box{fill:#f9fafb;stroke:#374151;stroke-width:2}.dot{fill:#1f4b7a}
</style></defs>
<rect width="1800" height="1220" fill="white"/>
<text x="70" y="60" class="ti">Requirements × Verification Cross-Reference — Public Retrospective Model</text>
<text x="70" y="100" class="su">Dots are taken from model/traceability.csv. A blank cell means no direct verification link is asserted in the current public reconstruction.</text>
