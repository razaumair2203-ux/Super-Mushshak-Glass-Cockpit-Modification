<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="920" viewBox="0 0 1700 920">
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker>
<style>.ti{font:700 40px Arial,sans-serif;fill:#111827}.su{font:21px Arial,sans-serif;fill:#4b5563}.h{font:700 25px Arial,sans-serif;fill:#111827}.t{font:19px Arial,sans-serif;fill:#374151}.b{fill:#f9fafb;stroke:#374151;stroke-width:3}.d{fill:#eef6ff;stroke:#1f4b7a;stroke-width:4}.g{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:4}.cmp{fill:#fff7ed;stroke:#9a5b13;stroke-width:3;stroke-dasharray:10 7}.l{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#a)}.dl{stroke:#6b7280;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#a)}</style>
</defs>
<rect width="1700" height="920" fill="white"/>
<text x="70" y="62" class="ti">Configuration Evolution and Prototype Identity</text>
<text x="70" y="100" class="su">Separate configuration branches prevent evidence from one prototype, software/database state or trade candidate being applied to another.</text>

<rect x="75" y="190" width="270" height="130" rx="16" class="b"/>
<text x="210" y="238" text-anchor="middle" class="h">CFG-000</text>
<text x="210" y="276" text-anchor="middle" class="t">Legacy aircraft baseline</text>

<rect x="460" y="190" width="310" height="130" rx="16" class="b"/>
<text x="615" y="238" text-anchor="middle" class="h">Architecture trade space</text>
<text x="615" y="276" text-anchor="middle" class="t">functional · interface · HMI · support</text>
<path d="M345 255 H460" class="l"/>

<!-- Dynon branch -->
<rect x="865" y="135" width="300" height="165" rx="16" class="d"/>
<text x="1015" y="180" text-anchor="middle" class="h">CFG-D1 · Dynon</text>
<text x="1015" y="216" text-anchor="middle" class="t">Initial installed SkyView prototype</text>
<text x="1015" y="252" text-anchor="middle" class="t">early sorties → discrepancy</text>

<rect x="1265" y="135" width="300" height="165" rx="16" class="d"/>
<text x="1415" y="180" text-anchor="middle" class="h">CFG-D2 · Dynon</text>
<text x="1415" y="216" text-anchor="middle" class="t">replacement / reconfiguration</text>
<text x="1415" y="252" text-anchor="middle" class="t">settings + databases → re-flight</text>

<path d="M770 225 H820 V217 H865" class="l"/>
<path d="M1165 217 H1265" class="l"/>

<rect x="1265" y="370" width="300" height="165" rx="16" class="d"/>
<text x="1415" y="415" text-anchor="middle" class="h">CFG-D3 · Dynon</text>
<text x="1415" y="451" text-anchor="middle" class="t">performance / Qatar evaluation</text>
<text x="1415" y="487" text-anchor="middle" class="t">repeated customer test sorties</text>
<path d="M1415 300 V370" class="l"/>

<!-- Garmin branch -->
<rect x="865" y="425" width="320" height="170" rx="16" class="g"/>
<text x="1025" y="470" text-anchor="middle" class="h">CFG-G1 · Garmin G900X/G950</text>
<text x="1025" y="506" text-anchor="middle" class="t">separate prototype / evaluation track</text>
<text x="1025" y="542" text-anchor="middle" class="t">public baseline partially reconstructed</text>
<path d="M615 320 V510 H865" class="l"/>

<!-- comparison evidence -->
<rect x="460" y="655" width="430" height="150" rx="16" class="cmp"/>
<text x="675" y="700" text-anchor="middle" class="h">CMP-G3X · comparative candidate</text>
<text x="675" y="738" text-anchor="middle" class="t">Dynon-vs-G3X evaluation deck</text>
<text x="675" y="772" text-anchor="middle" class="t">trade evidence only — not an aircraft configuration</text>
<path d="M615 320 V655" class="dl"/>

<rect x="1040" y="675" width="525" height="115" rx="16" class="b"/>
<text x="1302" y="716" text-anchor="middle" class="h">Configuration-control rule</text>
<text x="1302" y="754" text-anchor="middle" class="t">Verification, interface and decision evidence is linked to the identified state in which it occurred.</text>

<text x="75" y="870" class="su">Generic OEM architecture informs the design space but is not presented as the exact Super Mushshak aircraft wiring or installed LRU baseline.</text>
</svg>