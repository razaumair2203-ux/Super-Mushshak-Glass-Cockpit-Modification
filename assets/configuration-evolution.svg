<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker>
<style>.ti{font:700 42px Arial,sans-serif;fill:#111827}.su{font:23px Arial,sans-serif;fill:#4b5563}.h{font:700 27px Arial,sans-serif;fill:#111827}.t{font:21px Arial,sans-serif;fill:#374151}.b{fill:#f9fafb;stroke:#374151;stroke-width:3}.d{fill:#eef6ff;stroke:#1f4b7a;stroke-width:4}.g{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:4}.cmp{fill:#fff7ed;stroke:#9a5b13;stroke-width:3;stroke-dasharray:12 8}.l{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#a)}</style>
</defs>
<rect width="1700" height="900" fill="white"/>
<text x="70" y="65" class="ti">Configuration Evolution — Keep the Prototype Identities Separate</text>
<text x="70" y="105" class="su">Historical configuration states reconstructed from evidence; generic vendor architecture is not treated as aircraft-specific installation proof.</text>
<rect x="85" y="325" width="250" height="150" rx="18" class="b"/><text x="210" y="375" text-anchor="middle" class="h">CFG-000</text><text x="210" y="412" text-anchor="middle" class="t">Legacy aircraft</text><text x="210" y="443" text-anchor="middle" class="t">baseline</text>
<rect x="430" y="255" width="300" height="220" rx="18" class="d"/><text x="580" y="310" text-anchor="middle" class="h">CFG-D1 · Dynon</text><text x="580" y="350" text-anchor="middle" class="t">Initial installed SkyView</text><text x="580" y="382" text-anchor="middle" class="t">prototype</text><text x="580" y="425" text-anchor="middle" class="t">Early sorties → discrepancy</text>
<rect x="815" y="255" width="300" height="220" rx="18" class="d"/><text x="965" y="310" text-anchor="middle" class="h">CFG-D2 · Dynon</text><text x="965" y="350" text-anchor="middle" class="t">Post-replacement /</text><text x="965" y="382" text-anchor="middle" class="t">reconfiguration state</text><text x="965" y="425" text-anchor="middle" class="t">Databases/settings → re-flight</text>
<rect x="1200" y="255" width="300" height="220" rx="18" class="d"/><text x="1350" y="310" text-anchor="middle" class="h">CFG-D3 · Dynon</text><text x="1350" y="350" text-anchor="middle" class="t">Performance / Qatar</text><text x="1350" y="382" text-anchor="middle" class="t">customer-evaluation state</text><text x="1350" y="425" text-anchor="middle" class="t">Repeated flight evaluation</text>
<path d="M335 400 L430 365" class="l"/><path d="M730 365 L815 365" class="l"/><path d="M1115 365 L1200 365" class="l"/>
<rect x="500" y="620" width="360" height="180" rx="18" class="g"/><text x="680" y="675" text-anchor="middle" class="h">CFG-G1 · Garmin G900X/G950</text><text x="680" y="715" text-anchor="middle" class="t">Separate prototype / evaluation track</text><text x="680" y="753" text-anchor="middle" class="t">Partially reconstructed publicly</text>
<path d="M250 475 C300 620,410 675,500 695" class="l"/>
<rect x="1030" y="625" width="370" height="165" rx="18" class="cmp"/><text x="1215" y="680" text-anchor="middle" class="h">CMP-G3X · Trade study only</text><text x="1215" y="720" text-anchor="middle" class="t">Dynon-vs-G3X comparison deck</text><text x="1215" y="755" text-anchor="middle" class="t">NOT the G900X/G950 prototype</text>
<path d="M860 700 L1030 705" class="l"/>
<text x="85" y="850" class="su">Configuration control prevents evidence from one aircraft state, software/database state or vendor candidate being silently applied to another.</text>
</svg>