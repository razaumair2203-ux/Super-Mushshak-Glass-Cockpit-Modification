<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="790" viewBox="0 0 1650 790">
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker>
<style>.title{font:700 42px Arial,sans-serif;fill:#111827}.sub{font:22px Arial,sans-serif;fill:#4b5563}.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:19px Arial,sans-serif;fill:#374151}.b{fill:#fafafa;stroke:#374151;stroke-width:3}.l{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#a)}.fb{stroke:#6b7280;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#a)}</style>
</defs>
<rect width="1650" height="790" fill="white"/>
<text x="70" y="65" class="title">Evidence-to-Verification Engineering Thread</text>
<text x="70" y="104" class="sub">Traceability, configuration control and discrepancy closure shown as one closed-loop systems-engineering process.</text>

<g>
<rect x="55" y="235" width="220" height="125" rx="16" class="b"/><text x="165" y="282" text-anchor="middle" class="h">Evidence</text><text x="165" y="320" text-anchor="middle" class="t">photos · records · OEM</text>
<rect x="320" y="235" width="220" height="125" rx="16" class="b"/><text x="430" y="282" text-anchor="middle" class="h">Requirement</text><text x="430" y="320" text-anchor="middle" class="t">need · constraint</text>
<rect x="585" y="235" width="220" height="125" rx="16" class="b"/><text x="695" y="282" text-anchor="middle" class="h">Interface</text><text x="695" y="320" text-anchor="middle" class="t">power · data · HMI</text>
<rect x="850" y="235" width="220" height="125" rx="16" class="b"/><text x="960" y="282" text-anchor="middle" class="h">Configuration</text><text x="960" y="320" text-anchor="middle" class="t">identified as-tested state</text>
<rect x="1115" y="235" width="220" height="125" rx="16" class="b"/><text x="1225" y="282" text-anchor="middle" class="h">Verification</text><text x="1225" y="320" text-anchor="middle" class="t">ground · flight · review</text>
<rect x="1380" y="235" width="215" height="125" rx="16" class="b"/><text x="1488" y="282" text-anchor="middle" class="h">Disposition</text><text x="1488" y="320" text-anchor="middle" class="t">close · change · re-test</text>
</g>
<path d="M275 297 H320" class="l"/><path d="M540 297 H585" class="l"/><path d="M805 297 H850" class="l"/><path d="M1070 297 H1115" class="l"/><path d="M1335 297 H1380" class="l"/>

<path d="M1488 360 V520 H960 V380" class="fb"/>
<text x="1225" y="557" text-anchor="middle" class="h">Closed-loop discrepancy resolution</text>
<text x="1225" y="592" text-anchor="middle" class="t">Observation → analysis / OEM coordination → disposition → configuration update → re-verification</text>

<rect x="275" y="645" width="1100" height="85" rx="14" class="b"/>
<text x="825" y="678" text-anchor="middle" class="h">Verification claim rule</text>
<text x="825" y="710" text-anchor="middle" class="t">A test result is valid only for the configuration in which it was observed; unknown or unreconstructed evidence remains explicitly unknown.</text>
</svg>