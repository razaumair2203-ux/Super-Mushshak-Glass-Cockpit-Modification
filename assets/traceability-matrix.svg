<text x="70" y="1038" class="su">Verification evidence is configuration-specific. The matrix remains intentionally sparse where the surviving record does not justify a direct link.</text>
<text x="70" y="1075" class="su">Detailed event descriptions are in model/verification.csv; configuration states are in model/configurations.csv.</text>
