<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><style>
.ti{font:700 38px Arial,sans-serif;fill:#111827}.su{font:20px Arial,sans-serif;fill:#4b5563}
.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.sm{font:16px Arial,sans-serif;fill:#4b5563}
.b{fill:#f9fafb;stroke:#374151;stroke-width:2.5}.blue{fill:#eef6ff;stroke:#1f4b7a;stroke-width:3}.violet{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:3}.green{fill:#f0fdf4;stroke:#39764b;stroke-width:3}
.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6b7280;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
</style></defs>
<rect width="1800" height="1040" fill="white"/>
<text x="60" y="58" class="ti">Super Mushshak Glass-Cockpit Retrofit — Logical System Architecture</text>
<text x="60" y="94" class="su">Evidence-backed functional architecture. It is not an aircraft wiring diagram and does not expose controlled implementation detail.</text>

<rect x="70" y="175" width="360" height="150" rx="14" class="b"/>
<text x="250" y="217" text-anchor="middle" class="h">Aircraft electrical system</text>
<text x="250" y="265" text-anchor="middle" class="t">power · protection · transients</text>

<rect x="70" y="390" width="360" height="150" rx="14" class="b"/>
<text x="250" y="432" text-anchor="middle" class="h">Revised sensor suite</text>
<text x="250" y="480" text-anchor="middle" class="t">air data + attitude / heading</text>
<text x="250" y="512" text-anchor="middle" class="t">engine / airframe sensing</text>

<rect x="70" y="625" width="360" height="150" rx="14" class="b"/>
<text x="250" y="667" text-anchor="middle" class="h">Retained aircraft systems</text>
<text x="250" y="715" text-anchor="middle" class="t">NAV/COM · transponder · audio</text>
<text x="250" y="747" text-anchor="middle" class="t">legacy interfaces where applicable</text>

<rect x="560" y="180" width="680" height="600" rx="18" class="blue"/>
<text x="900" y="230" text-anchor="middle" class="h">Retrofit avionics integration</text>

<rect x="650" y="290" width="500" height="110" rx="14" class="b"/>
<text x="900" y="324" text-anchor="middle" class="h">Display / HMI layer</text>
<text x="900" y="356" text-anchor="middle" class="t">PFD / MFD / engine information</text>
<text x="900" y="383" text-anchor="middle" class="t">alerts + pilot / instructor interaction</text>

<rect x="650" y="430" width="500" height="110" rx="14" class="b"/>
<text x="900" y="464" text-anchor="middle" class="h">Avionics interface layer</text>
<text x="900" y="496" text-anchor="middle" class="t">NAV/COM + retained-avionics integration</text>
<text x="900" y="523" text-anchor="middle" class="t">power / data / discrete / audio interfaces</text>

<rect x="650" y="570" width="500" height="110" rx="14" class="b"/>
<text x="900" y="604" text-anchor="middle" class="h">Configuration-data layer</text>
<text x="900" y="636" text-anchor="middle" class="t">software · settings · databases</text>
<text x="900" y="663" text-anchor="middle" class="t">configuration identity + restoration</text>

<rect x="1370" y="175" width="360" height="150" rx="14" class="violet"/>
<text x="1550" y="217" text-anchor="middle" class="h">Pilot / instructor</text>
<text x="1550" y="265" text-anchor="middle" class="t">HMI · alerts · training use</text>

<rect x="1370" y="390" width="360" height="150" rx="14" class="green"/>
<text x="1550" y="432" text-anchor="middle" class="h">Ground &amp; flight verification</text>
<text x="1550" y="480" text-anchor="middle" class="t">functional checks · flight test</text>
<text x="1550" y="512" text-anchor="middle" class="t">discrepancy capture · re-test</text>

<rect x="1370" y="625" width="360" height="150" rx="14" class="violet"/>
<text x="1550" y="667" text-anchor="middle" class="h">Lifecycle / OEM support</text>
<text x="1550" y="715" text-anchor="middle" class="t">spares · LRU replacement · repair</text>
<text x="1550" y="747" text-anchor="middle" class="t">configuration restoration</text>

<path d="M430 250 H500 V345 H560" class="line"/>
<path d="M430 465 H560" class="line"/>
<path d="M430 700 H500 V520 H560" class="line"/>
<path d="M1240 345 H1310 V250 H1370" class="line"/>
<path d="M1240 485 H1370" class="line"/>
<path d="M1240 625 H1310 V700 H1370" class="line"/>

<path d="M1550 540 V860 H900 V780" class="dash"/>
<text x="1225" y="895" text-anchor="middle" class="sm">Observed discrepancy → engineering / OEM resolution → configuration update → re-verification</text>

<rect x="330" y="925" width="1140" height="95" rx="14" class="b"/>
<text x="900" y="962" text-anchor="middle" class="h">Configuration identity is part of the architecture</text>
<text x="900" y="995" text-anchor="middle" class="t">Dynon SkyView and Garmin G900X/G950-family prototype tracks remain distinct; G3X is trade-study evidence only.</text>
</svg>