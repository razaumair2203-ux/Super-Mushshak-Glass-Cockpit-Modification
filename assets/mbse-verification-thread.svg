<text x="800" y="510" text-anchor="middle" class="h">Closed-loop systems engineering</text>
<text x="800" y="550" text-anchor="middle" class="t">Observed discrepancy → engineering/OEM resolution → configuration update → re-test</text>
<text x="800" y="600" text-anchor="middle" class="t">Verification evidence is tied to the configuration in which it was observed.</text>
<text x="80" y="710" class="sub">Retrospective MBSE reconstruction of documented work — not a claim that SysML artefacts existed during the original programme.</text>
