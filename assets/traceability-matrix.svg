<text x="70" y="1110" class="h">Interpretation</text>
<text x="70" y="1150" class="su">REQ-007 is intentionally blank: the public reconstruction asserts the physical/harness requirement but does not invent a direct verification event.</text>
<text x="70" y="1187" class="su">VER-005 and VER-006 are observations with final closure not reconstructed; their dots are trace links, not “pass” marks.</text>
<text x="70" y="1224" class="su">This is a derived engineering view. Detailed event status is controlled in model/verification.csv and model/issues.csv.</text>
