<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><style>
.ti{font:700 38px Arial,sans-serif;fill:#111827}.su{font:20px Arial,sans-serif;fill:#4b5563}
.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.sm{font:16px Arial,sans-serif;fill:#4b5563}
.b{fill:#f9fafb;stroke:#374151;stroke-width:2.5}.blue{fill:#eef6ff;stroke:#1f4b7a;stroke-width:3}.violet{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:3}.green{fill:#f0fdf4;stroke:#39764b;stroke-width:3}.amber{fill:#fff7ed;stroke:#9a5b13;stroke-width:2.5}.head{fill:#f3f4f6}
.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6b7280;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
.grid{stroke:#c7cdd4;stroke-width:1}.dot{fill:#1f4b7a}
</style></defs>
<rect width="1800" height="980" fill="white"/>
<text x="60" y="58" class="ti">Systems-Engineering Lifecycle — Retrofit to Verified Aircraft</text>
<text x="60" y="94" class="su">Aircraft-level lifecycle; configuration control and evidence provenance remain cross-cutting controls.</text>
<rect x="55" y="170" width="265" height="180" rx="14" class="b"/>
<text x="187.5" y="212" text-anchor="middle" class="h">Need / constraints</text>
<text x="187.5" y="256" text-anchor="middle" class="t">training mission</text><text x="187.5" y="287" text-anchor="middle" class="t">legacy aircraft</text><text x="187.5" y="318" text-anchor="middle" class="t">acceptance / lifecycle</text><path d="M320 260 H340" class="line"/>
<rect x="340" y="170" width="265" height="180" rx="14" class="b"/>
<text x="472.5" y="212" text-anchor="middle" class="h">Requirements</text><text x="472.5" y="256" text-anchor="middle" class="t">flight + engine data</text><text x="472.5" y="287" text-anchor="middle" class="t">NAV/COM + HMI</text><text x="472.5" y="318" text-anchor="middle" class="t">power + maintainability</text><path d="M605 260 H625" class="line"/>
<rect x="625" y="170" width="265" height="180" rx="14" class="blue"/>
<text x="757.5" y="212" text-anchor="middle" class="h">Architecture</text><text x="757.5" y="256" text-anchor="middle" class="t">sensors · displays</text><text x="757.5" y="287" text-anchor="middle" class="t">interfaces</text><text x="757.5" y="318" text-anchor="middle" class="t">prototype alternatives</text><path d="M890 260 H910" class="line"/>
<rect x="910" y="170" width="265" height="180" rx="14" class="blue"/>
<text x="1042.5" y="212" text-anchor="middle" class="h">Integration</text><text x="1042.5" y="256" text-anchor="middle" class="t">installation + harness</text><text x="1042.5" y="287" text-anchor="middle" class="t">configuration</text><text x="1042.5" y="318" text-anchor="middle" class="t">retained-system interfaces</text><path d="M1175 260 H1195" class="line"/>
<rect x="1195" y="170" width="265" height="180" rx="14" class="green"/>
<text x="1327.5" y="212" text-anchor="middle" class="h">Verification</text><text x="1327.5" y="256" text-anchor="middle" class="t">ground checks</text><text x="1327.5" y="287" text-anchor="middle" class="t">flight test</text><text x="1327.5" y="318" text-anchor="middle" class="t">discrepancy closure</text><path d="M1460 260 H1480" class="line"/>
<rect x="1480" y="170" width="265" height="180" rx="14" class="green"/>
<text x="1612.5" y="212" text-anchor="middle" class="h">Validation</text><text x="1612.5" y="256" text-anchor="middle" class="t">customer / field</text><text x="1612.5" y="287" text-anchor="middle" class="t">evaluation</text><text x="1612.5" y="318" text-anchor="middle" class="t">operational feedback</text>
<rect x="250" y="430" width="1300" height="120" rx="14" class="violet"/>
<text x="900.0" y="472" text-anchor="middle" class="h">Cross-cutting controls</text><text x="900.0" y="502" text-anchor="middle" class="t">configuration identity · evidence provenance · change / decision history</text><text x="900.0" y="533" text-anchor="middle" class="t">software / settings / database state · public-release boundary</text>
<path d="M472.5 350 V430" class="dash"/><path d="M757.5 350 V430" class="dash"/><path d="M1042.5 350 V430" class="dash"/><path d="M1327.5 350 V430" class="dash"/><path d="M1612.5 350 V430" class="dash"/>
<rect x="330" y="650" width="1140" height="180" rx="14" class="blue"/>
<text x="900.0" y="692" text-anchor="middle" class="h">Installed-aircraft discrepancy loop</text><text x="900.0" y="734" text-anchor="middle" class="t">test / flight observation → isolate affected interface or configuration state</text><text x="900.0" y="768" text-anchor="middle" class="t">engineering / OEM analysis → disposition / hardware or configuration change</text><text x="900.0" y="802" text-anchor="middle" class="t">restore settings / databases → re-test / re-flight</text>
<path d="M1350 350 V610 H1320" class="dash"/><path d="M480 650 V610 H1030 V350" class="dash"/>
<text x="60" y="915" text-anchor="start" class="su">Evidence rule: derived engineering views are allowed; invented aircraft data or cross-configuration test claims are not.</text>
</svg>