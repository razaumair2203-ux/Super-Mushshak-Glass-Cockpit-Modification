<path d="M720 212 V244" class="strong"/><path d="M200 244 H1238" class="strong"/><text x="40" y="278" class="sm">L1 functional domains</text>
<rect x="40" y="305" width="320" height="170" rx="13" class="box"/><rect x="58" y="323" width="74" height="26" rx="13" class="chip"/><text x="95" y="341" text-anchor="middle" class="id">FUN-001/2</text><text x="200" y="378" text-anchor="middle" class="h">Acquire aircraft state</text><text x="200" y="412" text-anchor="middle" class="t">flight-state sensing</text><text x="200" y="440" text-anchor="middle" class="t">engine / airframe sensing</text>
