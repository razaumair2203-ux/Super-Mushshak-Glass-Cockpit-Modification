<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><style>
.ti{font:700 38px Arial,sans-serif;fill:#111827}.su{font:20px Arial,sans-serif;fill:#4b5563}
.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.sm{font:16px Arial,sans-serif;fill:#4b5563}
.b{fill:#f9fafb;stroke:#374151;stroke-width:2.5}.blue{fill:#eef6ff;stroke:#1f4b7a;stroke-width:3}.violet{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:3}.green{fill:#f0fdf4;stroke:#39764b;stroke-width:3}.amber{fill:#fff7ed;stroke:#9a5b13;stroke-width:2.5}.head{fill:#f3f4f6}
.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6b7280;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
.grid{stroke:#c7cdd4;stroke-width:1}.dot{fill:#1f4b7a}
</style></defs>
<rect width="1800" height="1120" fill="white"/>
<text x="60" y="58" class="ti">Aircraft Retrofit — Functional Decomposition</text>
<text x="60" y="94" class="su">Retrospective functional hierarchy derived from project evidence; vendor-specific implementation is separated from aircraft-level functions.</text>
<rect x="450" y="145" width="900" height="115" rx="14" class="blue"/>
<text x="900.0" y="187" text-anchor="middle" class="h">L0 · Modernise cockpit and avionics functions</text>
<text x="900.0" y="227" text-anchor="middle" class="t">while preserving aircraft integration, training use, verification and lifecycle support</text>
<path d="M900 260 V330" class="line"/><path d="M280 330 H1520" stroke="#1f2937" stroke-width="3" fill="none"/>
<rect x="80" y="390" width="500" height="240" rx="14" class="b"/>
<text x="330.0" y="432" text-anchor="middle" class="h">L1 · Sense aircraft state</text>
<text x="330.0" y="478" text-anchor="middle" class="t">flight-state data</text>
<text x="330.0" y="512" text-anchor="middle" class="t">engine / airframe data</text>
<text x="330.0" y="546" text-anchor="middle" class="t">sensor-suite integration</text>
<text x="330.0" y="580" text-anchor="middle" class="t">air data + attitude / heading</text>
<rect x="650" y="390" width="500" height="240" rx="14" class="b"/>
<text x="900.0" y="432" text-anchor="middle" class="h">L1 · Present &amp; interact</text>
<text x="900.0" y="478" text-anchor="middle" class="t">primary flight / multi-function display</text>
<text x="900.0" y="512" text-anchor="middle" class="t">engine / airframe display</text>
<text x="900.0" y="546" text-anchor="middle" class="t">pilot / instructor HMI</text>
<text x="900.0" y="580" text-anchor="middle" class="t">alerts · maps · information layout</text>
<rect x="1220" y="390" width="500" height="240" rx="14" class="b"/>
<text x="1470.0" y="432" text-anchor="middle" class="h">L1 · Integrate aircraft</text>
<text x="1470.0" y="478" text-anchor="middle" class="t">NAV/COM + retained systems</text>
<text x="1470.0" y="512" text-anchor="middle" class="t">audio / alerting</text>
<text x="1470.0" y="546" text-anchor="middle" class="t">electrical integration</text>
<text x="1470.0" y="580" text-anchor="middle" class="t">physical installation + harness change</text>
<rect x="365" y="705" width="500" height="240" rx="14" class="violet"/>
<text x="615.0" y="747" text-anchor="middle" class="h">L1 · Control configuration</text>
<text x="615.0" y="793" text-anchor="middle" class="t">software / settings / databases</text>
<text x="615.0" y="827" text-anchor="middle" class="t">hardware / LRU identity</text>
<text x="615.0" y="861" text-anchor="middle" class="t">as-tested state</text>
<text x="615.0" y="895" text-anchor="middle" class="t">change / decision history</text>
<rect x="935" y="705" width="500" height="240" rx="14" class="green"/>
<text x="1185.0" y="747" text-anchor="middle" class="h">L1 · Verify &amp; sustain</text>
<text x="1185.0" y="793" text-anchor="middle" class="t">installed verification</text>
<text x="1185.0" y="827" text-anchor="middle" class="t">discrepancy investigation</text>
<text x="1185.0" y="861" text-anchor="middle" class="t">re-test / re-flight</text>
<text x="1185.0" y="895" text-anchor="middle" class="t">maintenance / OEM support</text>
<path d="M330.0 330 V390" class="line"/><path d="M900.0 330 V390" class="line"/><path d="M1470.0 330 V390" class="line"/><path d="M900 330 V670 H615 V705" class="line"/><path d="M900 670 H1185 V705" class="line"/>
<rect x="250" y="1010" width="1300" height="70" rx="14" class="blue"/>
<text x="900.0" y="1038" text-anchor="middle" class="h">Cross-cutting controls</text>
<text x="900.0" y="1066" text-anchor="middle" class="t">configuration identity · evidence provenance · requirements traceability · interface control · public-release boundary</text>
</svg>