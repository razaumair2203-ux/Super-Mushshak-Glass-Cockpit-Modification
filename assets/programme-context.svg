<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="900" viewBox="0 0 1700 900">
<defs><style>
.ti{font:700 42px Arial,sans-serif;fill:#111827}.su{font:22px Arial,sans-serif;fill:#4b5563}.yr{font:700 26px Arial,sans-serif;fill:#111827}.h{font:700 27px Arial,sans-serif;fill:#111827}.t{font:21px Arial,sans-serif;fill:#374151}.sm{font:18px Arial,sans-serif;fill:#4b5563}.b{fill:#f9fafb;stroke:#374151;stroke-width:3}.a{fill:#eef6ff;stroke:#1f4b7a;stroke-width:4}</style></defs>
<rect width="1700" height="900" fill="white"/>
<text x="70" y="65" class="ti">Programme Context — Retrofit Evidence and Later Public Record</text>
<text x="70" y="104" class="su">Later contracts establish programme context and glass-cockpit continuity; they are not attributed as the consequence of a single prototype or individual.</text>

<line x1="150" y1="260" x2="1550" y2="260" stroke="#374151" stroke-width="5"/>
<circle cx="220" cy="260" r="15" fill="#374151"/>
<text x="220" y="210" text-anchor="middle" class="yr">2010</text>
<text x="220" y="315" text-anchor="middle" class="t">Dynon installed prototype</text>
<text x="220" y="348" text-anchor="middle" class="sm">integration · flight · discrepancy loop</text>

<circle cx="610" cy="260" r="15" fill="#374151"/>
<text x="610" y="210" text-anchor="middle" class="yr">2012</text>
<text x="610" y="315" text-anchor="middle" class="t">performance / customer evaluation</text>
<text x="610" y="348" text-anchor="middle" class="sm">configuration-specific field evidence</text>

<circle cx="1030" cy="260" r="15" fill="#374151"/>
<text x="1030" y="210" text-anchor="middle" class="yr">2016</text>
<text x="1030" y="315" text-anchor="middle" class="t">Nigeria 10 · Qatar 8</text>
<text x="1030" y="348" text-anchor="middle" class="sm">publicly reported new-customer contracts</text>

<circle cx="1450" cy="260" r="15" fill="#374151"/>
<text x="1450" y="210" text-anchor="middle" class="yr">2017</text>
<text x="1450" y="315" text-anchor="middle" class="t">Türkiye 52 · Azerbaijan 10</text>
<text x="1450" y="348" text-anchor="middle" class="sm">publicly reported new-customer contracts</text>

<rect x="130" y="470" width="670" height="230" rx="18" class="a"/>
<text x="465" y="522" text-anchor="middle" class="h">Glass-cockpit continuity</text>
<text x="465" y="570" text-anchor="middle" class="t">A 2016 public Nigeria delivery report described</text>
<text x="465" y="608" text-anchor="middle" class="t">the delivered Super Mushshak aircraft as glass-cockpit equipped.</text>
<text x="465" y="660" text-anchor="middle" class="sm">This supports product-modernisation continuity, not configuration identity.</text>

<rect x="900" y="470" width="670" height="230" rx="18" class="b"/>
<text x="1235" y="522" text-anchor="middle" class="h">Attribution boundary</text>
<text x="1235" y="570" text-anchor="middle" class="t">Public contract quantities and later operator history</text>
<text x="1235" y="608" text-anchor="middle" class="t">are programme-level context only.</text>
<text x="1235" y="660" text-anchor="middle" class="sm">No commercial-causation claim is made from the early retrofit evidence.</text>

<text x="70" y="805" class="sm">Sources are listed in docs/references.md. The technical record remains bounded to evidence-backed systems engineering, integration, test and evaluation activity.</text>
</svg>