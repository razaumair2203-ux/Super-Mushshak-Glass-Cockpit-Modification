<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><style>
.ti{font:700 38px Arial,sans-serif;fill:#111827}.su{font:20px Arial,sans-serif;fill:#4b5563}.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}
.b{fill:#f9fafb;stroke:#374151;stroke-width:2.5}.blue{fill:#eef6ff;stroke:#1f4b7a;stroke-width:3}.violet{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:3}.green{fill:#f0fdf4;stroke:#39764b;stroke-width:3}.amber{fill:#fff7ed;stroke:#9a5b13;stroke-width:2.5}
.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6b7280;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
</style></defs>
<rect width="1800" height="1000" fill="white"/>
<text x="60" y="58" class="ti">Configuration Evolution and Prototype Identity</text>
<text x="60" y="94" class="su">Prototype, trade-study and later product evidence are kept separate so evidence is never transferred between configurations.</text>

<rect x="70" y="190" width="290" height="130" rx="14" class="b"/>
<text x="215" y="232" text-anchor="middle" class="h">Legacy baseline</text>
<text x="215" y="265" text-anchor="middle" class="t">analogue / retained-aircraft</text><text x="215" y="293" text-anchor="middle" class="t">state</text>

<rect x="480" y="190" width="350" height="130" rx="14" class="b"/>
<text x="655" y="232" text-anchor="middle" class="h">Prototype trade space</text>
<text x="655" y="268" text-anchor="middle" class="t">display · interface · HMI</text>
<text x="655" y="297" text-anchor="middle" class="t">support / maintainability</text>
<path d="M360 255 H480" class="line"/>

<rect x="980" y="145" width="340" height="170" rx="14" class="blue"/>
<text x="1150" y="187" text-anchor="middle" class="h">Dynon SkyView prototype</text>
<text x="1150" y="223" text-anchor="middle" class="t">installed aircraft</text>
<text x="1150" y="253" text-anchor="middle" class="t">integration + flight testing</text>
<text x="1150" y="283" text-anchor="middle" class="t">customer-evaluation evidence</text>

<rect x="980" y="395" width="340" height="200" rx="14" class="violet"/>
<text x="1150" y="437" text-anchor="middle" class="h">Garmin G900X/G950 family</text>
<text x="1150" y="473" text-anchor="middle" class="t">separate prototype / evaluation</text>
<text x="1150" y="503" text-anchor="middle" class="t">path</text>
<text x="1150" y="528" text-anchor="middle" class="t">archived variant kept at</text>
<text x="1150" y="556" text-anchor="middle" class="t">family level until directly evidenced</text>

<path d="M830 255 H900 V230 H980" class="line"/>
<path d="M830 255 H900 V495 H980" class="line"/>

<rect x="480" y="650" width="420" height="160" rx="14" class="amber"/>
<text x="690" y="692" text-anchor="middle" class="h">Garmin G3X comparison deck</text>
<text x="690" y="724" text-anchor="middle" class="t">period trade-study candidate</text>
<text x="690" y="753" text-anchor="middle" class="t">comparison evidence only</text>
<text x="690" y="774" text-anchor="middle" class="t">not promoted into an installed</text><text x="690" y="802" text-anchor="middle" class="t">configuration</text>
<path d="M655 320 V650" class="dash"/>

<rect x="1430" y="145" width="300" height="170" rx="14" class="green"/>
<text x="1580" y="187" text-anchor="middle" class="h">Later export evidence</text>
<text x="1580" y="223" text-anchor="middle" class="t">Qatar — Garmin 950</text>
<text x="1580" y="253" text-anchor="middle" class="t">Nigeria — Dynon</text>
<text x="1580" y="283" text-anchor="middle" class="t">Türkiye — Garmin 950</text>
<path d="M1320 230 H1430" class="dash"/>

<rect x="1430" y="405" width="300" height="170" rx="14" class="green"/>
<text x="1580" y="447" text-anchor="middle" class="h">Azerbaijan</text>
<text x="1580" y="472" text-anchor="middle" class="t">10-aircraft public sale</text>
<text x="1580" y="500" text-anchor="middle" class="t">operator use verified by</text>
<text x="1580" y="528" text-anchor="middle" class="t">independent MOD sources</text>
<text x="1580" y="556" text-anchor="middle" class="t">avionics selection unknown</text>

<rect x="1070" y="690" width="660" height="120" rx="14" class="b"/>
<text x="1400" y="732" text-anchor="middle" class="h">Configuration-control rule</text>
<text x="1400" y="754" text-anchor="middle" class="t">Verification, interface and decision evidence belongs only</text>
<text x="1400" y="782" text-anchor="middle" class="t">to the identified as-tested state.</text>
<text x="1400" y="810" text-anchor="middle" class="t">Unknown or unreconstructed details remain explicitly unknown.</text>

<text x="70" y="920" class="su">OEM reference architecture may inform the design space; it is not relabelled as exact Super Mushshak wiring or installed LRU baseline.</text>
</svg>