<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><style>
.ti{font:700 38px Arial,sans-serif;fill:#111827}.su{font:20px Arial,sans-serif;fill:#4b5563}.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}
.b{fill:#f9fafb;stroke:#374151;stroke-width:2.5}.blue{fill:#eef6ff;stroke:#1f4b7a;stroke-width:3}.violet{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:3}.green{fill:#f0fdf4;stroke:#39764b;stroke-width:3}
.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs>
<rect width="1800" height="980" fill="white"/>
<text x="60" y="58" class="ti">Programme Context — Prototype Evidence and Later Public Record</text>
<text x="60" y="94" class="su">Public sources establish glass-cockpit continuity and export/operator history; they do not prove sole causation by one prototype or one engineer.</text>

<rect x="70" y="180" width="370" height="200" rx="14" class="blue"/>
<text x="255" y="222" text-anchor="middle" class="h">2012 · early retrofit evidence</text>
<text x="255" y="262" text-anchor="middle" class="t">Dynon SkyView installed prototype</text>
<text x="255" y="296" text-anchor="middle" class="t">integration / flight-test activity</text>
<text x="255" y="330" text-anchor="middle" class="t">customer-evaluation evidence</text>

<rect x="500" y="180" width="370" height="200" rx="14" class="green"/>
<text x="685" y="222" text-anchor="middle" class="h">2016 · new export customers</text>
<text x="685" y="262" text-anchor="middle" class="t">Qatar: 8-aircraft contract</text>
<text x="685" y="296" text-anchor="middle" class="t">Nigeria: 10-aircraft contract</text>
<text x="685" y="330" text-anchor="middle" class="t">Nigeria delivery described as</text>
<text x="685" y="359" text-anchor="middle" class="t">glass-cockpit equipped</text>

<rect x="930" y="180" width="370" height="200" rx="14" class="green"/>
<text x="1115" y="222" text-anchor="middle" class="h">2017 · expanded export record</text>
<text x="1115" y="262" text-anchor="middle" class="t">Türkiye: 52-aircraft contract</text>
<text x="1115" y="296" text-anchor="middle" class="t">Azerbaijan: 10-aircraft contract</text>
<text x="1115" y="330" text-anchor="middle" class="t">public programme context</text>

<rect x="1360" y="180" width="370" height="200" rx="14" class="green"/>
<text x="1545" y="222" text-anchor="middle" class="h">Operational continuity</text>
<text x="1545" y="262" text-anchor="middle" class="t">Qatar and Nigeria in service</text>
<text x="1545" y="296" text-anchor="middle" class="t">Azerbaijan training use verified</text>
<text x="1545" y="330" text-anchor="middle" class="t">Türkiye induction / inventory evidence</text>

<path d="M440 280 H500" class="line"/><path d="M870 280 H930" class="line"/><path d="M1300 280 H1360" class="line"/>

<rect x="120" y="485" width="760" height="250" rx="14" class="blue"/>
<text x="500" y="527" text-anchor="middle" class="h">Public glass-cockpit configuration evidence</text>
<text x="500" y="567" text-anchor="middle" class="t">Asian Military Review reported:</text>
<text x="500" y="599" text-anchor="middle" class="t">Qatar — Garmin 950</text>
<text x="500" y="631" text-anchor="middle" class="t">Nigeria — Dynon</text>
<text x="500" y="663" text-anchor="middle" class="t">Türkiye — Garmin 950</text>
<text x="500" y="695" text-anchor="middle" class="t">Azerbaijan avionics selection was not identified in that source.</text>

<rect x="930" y="485" width="750" height="250" rx="14" class="b"/>
<text x="1305" y="527" text-anchor="middle" class="h">Attribution boundary</text>
<text x="1305" y="567" text-anchor="middle" class="t">Later contracts and operator history are programme-level context.</text>
<text x="1305" y="599" text-anchor="middle" class="t">They support continuity of the modernised product concept.</text>
<text x="1305" y="631" text-anchor="middle" class="t">They do not establish that an early prototype was reproduced unchanged,</text>
<text x="1305" y="663" text-anchor="middle" class="t">or that one person / prototype alone caused later sales.</text>

<rect x="300" y="805" width="1200" height="100" rx="14" class="violet"/>
<text x="900" y="842" text-anchor="middle" class="h">Credibility rule</text>
<text x="900" y="875" text-anchor="middle" class="t">Use official operator sources where available; reputable aviation reporting for configuration detail; source-link third-party photos.</text>
</svg>