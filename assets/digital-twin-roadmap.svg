<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="980" viewBox="0 0 1750 980">
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker>
<style>.ti{font:700 42px Arial,sans-serif;fill:#111827}.su{font:23px Arial,sans-serif;fill:#4b5563}.h{font:700 27px Arial,sans-serif;fill:#111827}.t{font:21px Arial,sans-serif;fill:#374151}.b{fill:#f9fafb;stroke:#374151;stroke-width:3}.x{fill:#eef6ff;stroke:#1f4b7a;stroke-width:4}.f{fill:#f0fdf4;stroke:#39764b;stroke-width:4}.l{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#a)}</style>
</defs>
<rect width="1750" height="980" fill="white"/>
<text x="70" y="65" class="ti">Super Mushshak Digital Twin — Evidence-to-Executable Roadmap</text>
<text x="70" y="105" class="su">Follow-on digital engineering seeded by the retrofit archive; completed reconstruction is kept separate from future executable capability.</text>

<rect x="70" y="190" width="430" height="580" rx="20" class="b"/>
<text x="285" y="245" text-anchor="middle" class="h">Historical evidence layer</text>
<text x="110" y="305" class="t">• authentic photographs / records</text>
<text x="110" y="350" class="t">• configuration states</text>
<text x="110" y="395" class="t">• requirements / constraints</text>
<text x="110" y="440" class="t">• observed interfaces</text>
<text x="110" y="485" class="t">• discrepancy / issue status</text>
<text x="110" y="530" class="t">• ground / flight verification</text>
<text x="110" y="575" class="t">• OEM decisions / support loop</text>
<text x="110" y="620" class="t">• customer-evaluation evidence</text>
<text x="110" y="690" class="su">Status: reconstructed at public-safe level</text>

<rect x="655" y="190" width="430" height="580" rx="20" class="x"/>
<text x="870" y="245" text-anchor="middle" class="h">Digital-thread backbone</text>
<text x="695" y="305" class="t">• stable E / CLM / REQ / FUN IDs</text>
<text x="695" y="350" class="t">• function ↔ interface links</text>
<text x="695" y="395" class="t">• configuration baselines</text>
<text x="695" y="440" class="t">• V&amp;V + issue cross-reference</text>
<text x="695" y="485" class="t">• decision / change history</text>
<text x="695" y="530" class="t">• evidence provenance</text>
<text x="695" y="575" class="t">• observed / derived / unknown tags</text>
<text x="695" y="620" class="t">• typed graph links</text>
<text x="695" y="690" class="su">Status: first backbone implemented in /model</text>

<rect x="1240" y="190" width="430" height="580" rx="20" class="f"/>
<text x="1455" y="245" text-anchor="middle" class="h">Executable twin layer</text>
<text x="1280" y="305" class="t">• electrical loading model</text>
<text x="1280" y="350" class="t">• configuration-dependent failures</text>
<text x="1280" y="395" class="t">• maintenance / health state</text>
<text x="1280" y="440" class="t">• flight / avionics data replay</text>
<text x="1280" y="485" class="t">• verification scenario playback</text>
<text x="1280" y="530" class="t">• change-impact analysis</text>
<text x="1280" y="575" class="t">• requirements-to-test automation</text>
<text x="1280" y="620" class="t">• higher-fidelity models as releasable</text>
<text x="1280" y="690" class="su">Status: planned / incremental</text>

<path d="M500 480 H655" class="l"/><path d="M1085 480 H1240" class="l"/>
<text x="575" y="445" text-anchor="middle" class="su">normalise</text><text x="1160" y="445" text-anchor="middle" class="su">execute</text>

<rect x="360" y="830" width="1030" height="90" rx="16" class="b"/>
<text x="875" y="867" text-anchor="middle" class="h">Fidelity rule</text>
<text x="875" y="902" text-anchor="middle" class="t">No invented aircraft data: unknown stays unknown; fidelity increases only when releasable evidence supports it.</text>
</svg>