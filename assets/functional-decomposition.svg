<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker>
<style>
.ti{font:700 42px Arial,sans-serif;fill:#111827}.su{font:22px Arial,sans-serif;fill:#4b5563}
.h{font:700 24px Arial,sans-serif;fill:#111827}.t{font:19px Arial,sans-serif;fill:#374151}.sm{font:17px Arial,sans-serif;fill:#4b5563}
.top{fill:#eef6ff;stroke:#1f4b7a;stroke-width:4}.b{fill:#f9fafb;stroke:#374151;stroke-width:3}.ctrl{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:3}
.l{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#a)}
</style></defs>
<rect width="1800" height="1080" fill="white"/>
<text x="70" y="64" class="ti">Aircraft Retrofit — Functional Decomposition</text>
<text x="70" y="103" class="su">Retrospective functional hierarchy derived from project evidence. It is intentionally independent of exact vendor wiring.</text>

<rect x="520" y="155" width="760" height="120" rx="18" class="top"/>
<text x="900" y="203" text-anchor="middle" class="h">L0 · Modernise aircraft cockpit and avionics functions</text>
<text x="900" y="242" text-anchor="middle" class="t">while preserving aircraft integration, training use, verification and lifecycle support</text>

<path d="M900 275 V340" class="l"/>
<path d="M180 340 H1620" stroke="#1f2937" stroke-width="4" fill="none"/>
<path d="M180 340 V400" class="l"/><path d="M540 340 V400" class="l"/><path d="M900 340 V400" class="l"/><path d="M1260 340 V400" class="l"/><path d="M1620 340 V400" class="l"/>

<rect x="45" y="400" width="300" height="330" rx="16" class="b"/>
<text x="195" y="445" text-anchor="middle" class="h">L1 · Sense aircraft state</text>
<text x="75" y="495" class="t">FUN-001 · flight-state data</text>
<text x="75" y="535" class="t">FUN-002 · engine/airframe data</text>
<text x="75" y="575" class="t">sensor-suite integration</text>
<text x="75" y="615" class="t">air-data / attitude-heading</text>
<text x="75" y="655" class="t">engine measurement paths</text>
<text x="75" y="700" class="sm">Only evidence-backed sensing is modelled.</text>

<rect x="405" y="400" width="300" height="330" rx="16" class="b"/>
<text x="555" y="445" text-anchor="middle" class="h">L1 · Present &amp; interact</text>
<text x="435" y="495" class="t">FUN-003 · primary flight display</text>
<text x="435" y="535" class="t">FUN-004 · engine/airframe display</text>
<text x="435" y="575" class="t">FUN-010 · pilot/instructor HMI</text>
<text x="435" y="615" class="t">alerts · maps · information layout</text>
<text x="435" y="655" class="t">training / evaluation interaction</text>
<text x="435" y="700" class="sm">HMI claims remain configuration-specific.</text>

<rect x="765" y="400" width="300" height="330" rx="16" class="b"/>
<text x="915" y="445" text-anchor="middle" class="h">L1 · Integrate aircraft</text>
<text x="795" y="495" class="t">FUN-005 · NAV/COM / retained systems</text>
<text x="795" y="535" class="t">FUN-006 · audio / alerting</text>
<text x="795" y="575" class="t">FUN-008 · electrical integration</text>
<text x="795" y="615" class="t">FUN-009 · physical / harness change</text>
<text x="795" y="655" class="t">power · data · discrete · audio paths</text>
<text x="795" y="700" class="sm">Pins/routes are outside public scope.</text>

<rect x="1125" y="400" width="300" height="330" rx="16" class="b"/>
<text x="1275" y="445" text-anchor="middle" class="h">L1 · Control configuration</text>
<text x="1155" y="495" class="t">FUN-007 · software/settings/data</text>
<text x="1155" y="535" class="t">hardware/LRU identity</text>
<text x="1155" y="575" class="t">database / terrain state</text>
<text x="1155" y="615" class="t">as-tested configuration</text>
<text x="1155" y="655" class="t">change / decision history</text>
<text x="1155" y="700" class="sm">Unknown baseline fields stay unknown.</text>

<rect x="1485" y="400" width="270" height="330" rx="16" class="b"/>
<text x="1620" y="445" text-anchor="middle" class="h">L1 · Verify &amp; sustain</text>
<text x="1515" y="495" class="t">FUN-011 · installed V&amp;V</text>
<text x="1515" y="535" class="t">discrepancy investigation</text>
<text x="1515" y="575" class="t">re-test / re-flight</text>
<text x="1515" y="615" class="t">FUN-012 · maintenance/OEM</text>
<text x="1515" y="655" class="t">spares · LRU replacement</text>
<text x="1515" y="700" class="sm">Closure status follows evidence.</text>

<rect x="250" y="835" width="1300" height="145" rx="18" class="ctrl"/>
<text x="900" y="880" text-anchor="middle" class="h">Cross-cutting controls</text>
<text x="900" y="923" text-anchor="middle" class="t">configuration identity · evidence provenance · requirements traceability · interface control · public-release boundary</text>
<text x="900" y="960" text-anchor="middle" class="sm">These controls apply to Dynon and Garmin tracks independently; comparison evidence is not merged into installed-configuration evidence.</text>
</svg>