<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" preserveAspectRatio="xMidYMid meet">
<style>.title{font:700 34px Arial,sans-serif;fill:#111827}.sub{font:17px Arial,sans-serif;fill:#4b5563}.h{font:700 19px Arial,sans-serif;fill:#111827}.t{font:16px Arial,sans-serif;fill:#374151}.sm{font:14px Arial,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#475569;stroke-width:2}.blue{fill:#eff6ff;stroke:#315b8c;stroke-width:2.5}.green{fill:#f0fdf4;stroke:#3f7c52;stroke-width:2.5}.violet{fill:#f5f3ff;stroke:#6554a1;stroke-width:2.5}.slate{fill:#f8fafc;stroke:#64748b;stroke-width:2}.strong{stroke:#334155;stroke-width:2.4;fill:none}</style>
<rect width="1440" height="860" fill="white"/><text x="40" y="52" class="title">Programme Context — Prototype Development to International Product-Line Scale</text><text x="40" y="82" class="sub">Project engineering, customer evaluation and later public market outcomes are shown as one product-line progression.</text>
<rect x="60" y="155" width="300" height="150" rx="13" class="blue"/><text x="210" y="198" text-anchor="middle" class="h">2011–2012 · prototype & test</text><text x="210" y="234" text-anchor="middle" class="t">Dynon installed prototype</text><text x="210" y="264" text-anchor="middle" class="t">flight / evaluation activity</text>
<rect x="395" y="155" width="300" height="150" rx="13" class="green"/><text x="545" y="198" text-anchor="middle" class="h">2016 · export expansion</text><text x="545" y="234" text-anchor="middle" class="t">Qatar · 8 aircraft</text><text x="545" y="264" text-anchor="middle" class="t">Nigeria · 10 aircraft</text>
<rect x="730" y="155" width="300" height="150" rx="13" class="green"/><text x="880" y="198" text-anchor="middle" class="h">2017 · continued expansion</text><text x="880" y="234" text-anchor="middle" class="t">Türkiye · 52 aircraft</text><text x="880" y="264" text-anchor="middle" class="t">Azerbaijan · 10 aircraft</text>
<rect x="1065" y="155" width="315" height="150" rx="13" class="green"/><text x="1222" y="198" text-anchor="middle" class="h">Later operator continuity</text><text x="1222" y="234" text-anchor="middle" class="t">public operator / training evidence</text><text x="1222" y="264" text-anchor="middle" class="t">across multiple customers</text><path d="M360 230 H395 M695 230 H730 M1030 230 H1065" class="strong"/>
<rect x="95" y="385" width="590" height="220" rx="14" class="violet"/><text x="390" y="430" text-anchor="middle" class="h">Public configuration cross-check</text><text x="390" y="472" text-anchor="middle" class="t">Qatar — Garmin 950</text><text x="390" y="506" text-anchor="middle" class="t">Nigeria — Dynon</text><text x="390" y="540" text-anchor="middle" class="t">Türkiye — Garmin 950</text><text x="390" y="574" text-anchor="middle" class="t">Azerbaijan — selection not identified in cited source</text>
<rect x="755" y="385" width="590" height="220" rx="14" class="box"/><text x="1050" y="430" text-anchor="middle" class="h">Product-line progression</text><text x="1050" y="472" text-anchor="middle" class="t">Later contracts demonstrate international product maturity.</text><text x="1050" y="506" text-anchor="middle" class="t">Customer configurations continued to evolve under configuration control.</text><text x="1050" y="540" text-anchor="middle" class="t">Engineering contribution and market outcome are presented as distinct evidence streams.</text><text x="1050" y="574" text-anchor="middle" class="sm">Together they show programme scale without overstating individual attribution.</text>
<rect x="180" y="685" width="1080" height="100" rx="13" class="slate"/><text x="720" y="722" text-anchor="middle" class="h">Source hierarchy</text><text x="720" y="754" text-anchor="middle" class="t">project evidence → OEM reference → official/operator sources → specialist aviation reporting → contextual media</text></svg>