<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><style>
.ti{font:700 38px Arial,sans-serif;fill:#111827}.su{font:20px Arial,sans-serif;fill:#4b5563}.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:18px Arial,sans-serif;fill:#374151}.sm{font:16px Arial,sans-serif;fill:#4b5563}
.b{fill:#f9fafb;stroke:#374151;stroke-width:2.5}.blue{fill:#eef6ff;stroke:#1f4b7a;stroke-width:3}.violet{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:3}.green{fill:#f0fdf4;stroke:#39764b;stroke-width:3}
.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}
</style></defs>
<rect width="1800" height="1000" fill="white"/>
<text x="60" y="58" class="ti">Super Mushshak Digital Twin — Evidence-to-Executable Roadmap</text>
<text x="60" y="94" class="su">Follow-on digital engineering seeded by the retrofit archive; implemented reconstruction is kept separate from future executable capability.</text>

<rect x="60" y="175" width="480" height="620" rx="18" class="b"/>
<text x="300" y="225" text-anchor="middle" class="h">Historical evidence layer</text>
<text x="98" y="290" class="t">• authentic photographs / records</text><text x="98" y="338" class="t">• configuration states</text><text x="98" y="386" class="t">• requirements / constraints</text><text x="98" y="434" class="t">• observed interfaces</text><text x="98" y="482" class="t">• discrepancy / issue status</text><text x="98" y="530" class="t">• ground / flight verification</text><text x="98" y="578" class="t">• OEM support loop</text><text x="98" y="626" class="t">• customer-evaluation evidence</text><text x="300" y="748" text-anchor="middle" class="sm">Status: reconstructed at public-safe level</text>

<rect x="660" y="175" width="480" height="620" rx="18" class="blue"/>
<text x="900" y="225" text-anchor="middle" class="h">Digital-thread backbone</text>
<text x="698" y="290" class="t">• stable evidence / claim / requirement IDs</text><text x="698" y="338" class="t">• function ↔ interface links</text><text x="698" y="386" class="t">• configuration baselines</text><text x="698" y="434" class="t">• V&amp;V + issue cross-reference</text><text x="698" y="482" class="t">• decision / change history</text><text x="698" y="530" class="t">• evidence provenance</text><text x="698" y="578" class="t">• observed / derived / unknown tags</text><text x="698" y="626" class="t">• typed graph links</text><text x="900" y="748" text-anchor="middle" class="sm">Status: first backbone implemented in /model</text>

<rect x="1260" y="175" width="480" height="620" rx="18" class="green"/>
<text x="1500" y="225" text-anchor="middle" class="h">Executable twin layer</text>
<text x="1298" y="290" class="t">• electrical loading model</text><text x="1298" y="338" class="t">• configuration-dependent failures</text><text x="1298" y="386" class="t">• maintenance / health state</text><text x="1298" y="434" class="t">• flight / avionics data replay</text><text x="1298" y="482" class="t">• verification scenario playback</text><text x="1298" y="530" class="t">• change-impact analysis</text><text x="1298" y="578" class="t">• requirements-to-test automation</text><text x="1298" y="626" class="t">• higher-fidelity models as releasable</text><text x="1500" y="748" text-anchor="middle" class="sm">Status: planned / incremental</text>

<path d="M540 485 H660" class="line"/><path d="M1140 485 H1260" class="line"/>
<text x="600" y="445" text-anchor="middle" class="sm">normalise</text><text x="1200" y="445" text-anchor="middle" class="sm">execute</text>

<rect x="350" y="850" width="1100" height="105" rx="14" class="violet"/>
<text x="900" y="890" text-anchor="middle" class="h">Fidelity rule</text>
<text x="900" y="925" text-anchor="middle" class="t">No invented aircraft data: unknown stays unknown; fidelity increases only when releasable evidence supports it.</text>
</svg>