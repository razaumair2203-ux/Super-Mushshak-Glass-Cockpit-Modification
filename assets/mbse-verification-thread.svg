<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker><style>
.ti{font:700 38px Arial,sans-serif;fill:#111827}.su{font:20px Arial,sans-serif;fill:#4b5563}.h{font:700 22px Arial,sans-serif;fill:#111827}.t{font:17px Arial,sans-serif;fill:#374151}
.b{fill:#f9fafb;stroke:#374151;stroke-width:2.5}.blue{fill:#eef6ff;stroke:#1f4b7a;stroke-width:3}
.line{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6b7280;stroke-width:2.5;fill:none;stroke-dasharray:8 7;marker-end:url(#arrow)}
</style></defs>
<rect width="1800" height="900" fill="white"/>
<text x="60" y="58" class="ti">Evidence-to-Verification Engineering Thread</text>
<text x="60" y="94" class="su">Traceability, configuration control and discrepancy closure shown as a single systems-engineering loop.</text>

<rect x="60" y="210" width="250" height="125" rx="14" class="b"/><text x="185" y="252" text-anchor="middle" class="h">Evidence</text><text x="185" y="292" text-anchor="middle" class="t">photos · records · OEM</text>
<path d="M310 272 H350" class="line"/>
<rect x="350" y="210" width="250" height="125" rx="14" class="b"/><text x="475" y="252" text-anchor="middle" class="h">Requirement</text><text x="475" y="292" text-anchor="middle" class="t">need · constraint</text>
<path d="M600 272 H640" class="line"/>
<rect x="640" y="210" width="250" height="125" rx="14" class="b"/><text x="765" y="252" text-anchor="middle" class="h">Interface</text><text x="765" y="292" text-anchor="middle" class="t">power · data · HMI</text>
<path d="M890 272 H930" class="line"/>
<rect x="930" y="210" width="250" height="125" rx="14" class="b"/><text x="1055" y="252" text-anchor="middle" class="h">Configuration</text><text x="1055" y="292" text-anchor="middle" class="t">identified as-tested state</text>
<path d="M1180 272 H1220" class="line"/>
<rect x="1220" y="210" width="250" height="125" rx="14" class="b"/><text x="1345" y="252" text-anchor="middle" class="h">Verification</text><text x="1345" y="292" text-anchor="middle" class="t">ground · flight · review</text>
<path d="M1470 272 H1510" class="line"/>
<rect x="1510" y="210" width="250" height="125" rx="14" class="b"/><text x="1635" y="252" text-anchor="middle" class="h">Disposition</text><text x="1635" y="292" text-anchor="middle" class="t">close · change · re-test</text>

<path d="M1560 335 V500 H1020 V355" class="dash"/>
<text x="1290" y="545" text-anchor="middle" class="h">Closed-loop discrepancy resolution</text>
<text x="1290" y="580" text-anchor="middle" class="t">Observation → analysis / OEM coordination → disposition → configuration update → re-verification</text>

<rect x="240" y="665" width="1320" height="130" rx="14" class="blue"/>
<text x="900" y="707" text-anchor="middle" class="h">Verification claim rule</text>
<text x="900" y="743" text-anchor="middle" class="t">A verification result belongs only to the identified configuration in which it was observed.</text>
<text x="900" y="775" text-anchor="middle" class="t">If evidence is absent or final closure cannot be reconstructed, the public record says so explicitly.</text>
</svg>