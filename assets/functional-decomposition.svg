<rect x="732" y="305" width="320" height="170" rx="13" class="box"/><rect x="750" y="323" width="89" height="26" rx="13" class="chip"/><text x="795" y="341" text-anchor="middle" class="id">FUN-005/6</text><text x="892" y="378" text-anchor="middle" class="h">Integrate avionics services</text><text x="892" y="412" text-anchor="middle" class="t">NAV/COM · retained avionics</text><text x="892" y="440" text-anchor="middle" class="t">audio · alerting</text>
<rect x="1078" y="305" width="320" height="170" rx="13" class="box"/><rect x="1096" y="323" width="89" height="26" rx="13" class="chip"/><text x="1141" y="341" text-anchor="middle" class="id">FUN-008/9</text><text x="1238" y="378" text-anchor="middle" class="h">Integrate aircraft platform</text><text x="1238" y="412" text-anchor="middle" class="t">electrical power / protection</text><text x="1238" y="440" text-anchor="middle" class="t">physical install · harness</text>
