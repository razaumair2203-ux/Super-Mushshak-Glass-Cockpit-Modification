<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1440 890" preserveAspectRatio="xMidYMid meet">
<style>.title{font:700 34px Arial,sans-serif;fill:#111827}.sub{font:17px Arial,sans-serif;fill:#4b5563}.h{font:700 19px Arial,sans-serif;fill:#111827}.t{font:16px Arial,sans-serif;fill:#374151}.sm{font:14px Arial,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#475569;stroke-width:2}.blue{fill:#eff6ff;stroke:#315b8c;stroke-width:2.5}.green{fill:#f0fdf4;stroke:#3f7c52;stroke-width:2.5}.violet{fill:#f5f3ff;stroke:#6554a1;stroke-width:2.5}.slate{fill:#f8fafc;stroke:#64748b;stroke-width:2}.strong{stroke:#334155;stroke-width:2.4;fill:none}</style>
<rect width="1440" height="890" fill="white"/><text x="40" y="52" class="title">Evidence-to-Verification Digital Thread</text><text x="40" y="82" class="sub">A clean closure loop: every observation is tied to evidence and to the as-tested configuration before a claim is made.</text>
<rect x="45" y="170" width="230" height="110" rx="13" class="box"/><text x="160" y="210" text-anchor="middle" class="h">1 · Evidence</text><text x="160" y="244" text-anchor="middle" class="t">photo · record · OEM source</text>
<rect x="325" y="170" width="230" height="110" rx="13" class="box"/><text x="440" y="210" text-anchor="middle" class="h">2 · Requirement</text><text x="440" y="244" text-anchor="middle" class="t">need / constraint</text>
<rect x="605" y="170" width="230" height="110" rx="13" class="box"/><text x="720" y="210" text-anchor="middle" class="h">3 · Function / interface</text><text x="720" y="244" text-anchor="middle" class="t">what + boundary</text>
<rect x="885" y="170" width="230" height="110" rx="13" class="violet"/><text x="1000" y="210" text-anchor="middle" class="h">4 · Configuration</text><text x="1000" y="244" text-anchor="middle" class="t">identified as-tested state</text>
<rect x="1165" y="170" width="230" height="110" rx="13" class="green"/><text x="1280" y="210" text-anchor="middle" class="h">5 · Verification claim</text><text x="1280" y="244" text-anchor="middle" class="t">result / boundary / status</text><path d="M275 225 H325 M555 225 H605 M835 225 H885 M1115 225 H1165" class="strong"/>
<rect x="165" y="375" width="1110" height="240" rx="16" class="blue"/><text x="720" y="417" text-anchor="middle" class="h">Installed-aircraft discrepancy closure</text>
<rect x="215" y="465" width="180" height="92" rx="12" class="box"/><text x="305" y="501" text-anchor="middle" class="h">Observe</text><text x="305" y="531" text-anchor="middle" class="sm">capture symptom</text>
<rect x="425" y="465" width="180" height="92" rx="12" class="box"/><text x="515" y="501" text-anchor="middle" class="h">Isolate</text><text x="515" y="531" text-anchor="middle" class="sm">I/F or configuration</text>
<rect x="635" y="465" width="180" height="92" rx="12" class="box"/><text x="725" y="501" text-anchor="middle" class="h">Analyse</text><text x="725" y="531" text-anchor="middle" class="sm">engineering / OEM</text>
<rect x="845" y="465" width="180" height="92" rx="12" class="box"/><text x="935" y="501" text-anchor="middle" class="h">Disposition</text><text x="935" y="531" text-anchor="middle" class="sm">hardware / config change</text>
<rect x="1055" y="465" width="180" height="92" rx="12" class="green"/><text x="1145" y="501" text-anchor="middle" class="h">Re-verify</text><text x="1145" y="531" text-anchor="middle" class="sm">ground / flight re-test</text><path d="M395 511 H425 M605 511 H635 M815 511 H845 M1025 511 H1055" class="strong"/>
<rect x="185" y="695" width="1070" height="130" rx="14" class="slate"/><text x="720" y="735" text-anchor="middle" class="h">Claim discipline</text><text x="720" y="770" text-anchor="middle" class="t">Observed ≠ closed. Reverified ≠ certified. Customer validation ≠ technical verification.</text><text x="720" y="801" text-anchor="middle" class="t">When final closure is not recoverable, the model leaves it explicitly unreconstructed.</text></svg>