<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
<defs>
<marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/></marker>
<style>
.ti{font:700 42px Arial,sans-serif;fill:#111827}.su{font:22px Arial,sans-serif;fill:#4b5563}
.h{font:700 25px Arial,sans-serif;fill:#111827}.t{font:20px Arial,sans-serif;fill:#374151}.sm{font:17px Arial,sans-serif;fill:#4b5563}
.box{fill:#f9fafb;stroke:#374151;stroke-width:3}.core{fill:#eef6ff;stroke:#1f4b7a;stroke-width:4}.ext{fill:#f5f3ff;stroke:#5b4b8a;stroke-width:3}
.line{stroke:#1f2937;stroke-width:4;fill:none;marker-end:url(#a)}.dash{stroke:#6b7280;stroke-width:3;fill:none;stroke-dasharray:10 8;marker-end:url(#a)}
</style></defs>
<rect width="1700" height="980" fill="white"/>
<text x="70" y="65" class="ti">Super Mushshak Glass-Cockpit Retrofit — Logical System Architecture</text>
<text x="70" y="105" class="su">Evidence-backed functional view. Exact wiring, pinouts, harness routing and equipment locations are intentionally omitted.</text>

<!-- source / platform -->
<rect x="70" y="190" width="330" height="130" rx="16" class="box"/>
<text x="235" y="235" text-anchor="middle" class="h">Aircraft electrical system</text>
<text x="235" y="272" text-anchor="middle" class="t">power · protection · transients</text>

<rect x="70" y="370" width="330" height="150" rx="16" class="box"/>
<text x="235" y="415" text-anchor="middle" class="h">Revised sensor suite</text>
<text x="235" y="452" text-anchor="middle" class="t">air data · attitude / heading</text>
<text x="235" y="484" text-anchor="middle" class="t">engine / airframe sensing</text>

<rect x="70" y="575" width="330" height="145" rx="16" class="box"/>
<text x="235" y="620" text-anchor="middle" class="h">Retained aircraft systems</text>
<text x="235" y="657" text-anchor="middle" class="t">NAV / COM · transponder · audio</text>
<text x="235" y="689" text-anchor="middle" class="t">legacy interfaces as applicable</text>

<!-- integration core -->
<rect x="540" y="205" width="570" height="500" rx="20" class="core"/>
<text x="825" y="255" text-anchor="middle" class="h">Retrofit avionics integration</text>

<rect x="610" y="300" width="430" height="82" rx="12" class="box"/>
<text x="825" y="350" text-anchor="middle" class="t">Glass displays · PFD / MFD / EMS</text>
<rect x="610" y="415" width="430" height="82" rx="12" class="box"/>
<text x="825" y="465" text-anchor="middle" class="t">NAV / COM and avionics interface layer</text>
<rect x="610" y="530" width="430" height="82" rx="12" class="box"/>
<text x="825" y="580" text-anchor="middle" class="t">Software · settings · databases</text>

<!-- external actors -->
<rect x="1270" y="180" width="350" height="135" rx="16" class="ext"/>
<text x="1445" y="225" text-anchor="middle" class="h">Pilot / instructor</text>
<text x="1445" y="262" text-anchor="middle" class="t">HMI · alerts · training use</text>

<rect x="1270" y="370" width="350" height="145" rx="16" class="ext"/>
<text x="1445" y="415" text-anchor="middle" class="h">Ground & flight verification</text>
<text x="1445" y="452" text-anchor="middle" class="t">functional checks · flight test</text>
<text x="1445" y="484" text-anchor="middle" class="t">discrepancy capture · re-test</text>

<rect x="1270" y="570" width="350" height="145" rx="16" class="ext"/>
<text x="1445" y="615" text-anchor="middle" class="h">Lifecycle / OEM support</text>
<text x="1445" y="652" text-anchor="middle" class="t">spares · LRU replacement · repair</text>
<text x="1445" y="684" text-anchor="middle" class="t">configuration restoration</text>

<!-- orthogonal connectors -->
<path d="M400 255 H470 V340 H540" class="line"/>
<path d="M400 445 H495 V455 H540" class="line"/>
<path d="M400 647 H470 V470 H540" class="line"/>

<path d="M1110 340 H1190 V248 H1270" class="line"/>
<path d="M1110 455 H1270" class="line"/>
<path d="M1110 570 H1190 V642 H1270" class="line"/>

<!-- verification feedback loop kept below content -->
<path d="M1445 515 V790 H825 V705" class="dash"/>
<text x="1130" y="822" text-anchor="middle" class="sm">Observed discrepancy → engineering/OEM resolution → configuration update → re-verification</text>

<!-- config identity note -->
<rect x="345" y="865" width="1010" height="72" rx="14" class="box"/>
<text x="850" y="894" text-anchor="middle" class="h">Configuration identity is part of the architecture</text>
<text x="850" y="923" text-anchor="middle" class="sm">Dynon SkyView and Garmin G900X/G950-family tracks are modelled separately; Garmin G3X remains trade-study evidence only.</text>
</svg>