</style><rect width="1440" height="930" fill="white"/><text x="40" y="52" class="title">Aircraft Retrofit — Functional Decomposition</text><text x="40" y="82" class="sub">Aircraft-level functional hierarchy. Functions are equipment-independent; implementation is configuration-specific.</text>
