<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet">
<style>.title{font:700 34px Arial,sans-serif;fill:#111827}.sub{font:17px Arial,sans-serif;fill:#4b5563}.h{font:700 19px Arial,sans-serif;fill:#111827}.t{font:16px Arial,sans-serif;fill:#374151}.sm{font:14px Arial,sans-serif;fill:#4b5563}.box{fill:#fff;stroke:#475569;stroke-width:2}.blue{fill:#eff6ff;stroke:#315b8c;stroke-width:2.5}.violet{fill:#f5f3ff;stroke:#6554a1;stroke-width:2.5}.amber{fill:#fffbeb;stroke:#a96b13;stroke-width:2.5}.slate{fill:#f8fafc;stroke:#64748b;stroke-width:2}.strong{stroke:#334155;stroke-width:2.4;fill:none}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:7 6}</style>
<rect width="1440" height="900" fill="white"/><text x="40" y="52" class="title">Prototype &amp; Configuration Identity</text><text x="40" y="82" class="sub">Configuration separation is a primary credibility control: evidence is never transferred between prototype families.</text>
<rect x="60" y="160" width="260" height="130" rx="13" class="box"/><text x="190" y="205" text-anchor="middle" class="h">CFG-000</text><text x="190" y="238" text-anchor="middle" class="t">Legacy aircraft baseline</text><text x="190" y="266" text-anchor="middle" class="sm">detailed baseline withheld</text>
<rect x="375" y="140" width="310" height="170" rx="13" class="blue"/><text x="530" y="184" text-anchor="middle" class="h">Dynon prototype track</text><text x="530" y="219" text-anchor="middle" class="t">CFG-D1 · initial installed prototype</text><text x="530" y="249" text-anchor="middle" class="t">CFG-D2 · post-replacement / reconfig</text><text x="530" y="279" text-anchor="middle" class="t">CFG-D3 · evaluation state</text>
<rect x="755" y="140" width="310" height="170" rx="13" class="violet"/><text x="910" y="184" text-anchor="middle" class="h">Garmin prototype track</text><text x="910" y="219" text-anchor="middle" class="t">CFG-G1 · G900X/G950 family</text><text x="910" y="249" text-anchor="middle" class="t">separate evaluation path</text><text x="910" y="279" text-anchor="middle" class="sm">exact installed public baseline partial</text>
<rect x="1120" y="160" width="260" height="130" rx="13" class="amber"/><text x="1250" y="205" text-anchor="middle" class="h">CMP-G3X</text><text x="1250" y="238" text-anchor="middle" class="t">Comparison artefact</text><text x="1250" y="266" text-anchor="middle" class="sm">trade study ≠ installed config</text><path d="M320 225 H375 M685 225 H755" class="strong"/><path d="M1065 225 H1120" class="dash"/>
<text x="60" y="380" class="sm">EVIDENCE OWNERSHIP BY CONFIGURATION</text>
<rect x="60" y="405" width="405" height="190" rx="13" class="blue"/><text x="262" y="448" text-anchor="middle" class="h">Dynon installed-aircraft evidence</text><text x="262" y="486" text-anchor="middle" class="t">cockpit / in-flight photographs</text><text x="262" y="516" text-anchor="middle" class="t">integration &amp; troubleshooting records</text><text x="262" y="546" text-anchor="middle" class="t">flight / customer-evaluation status</text><text x="262" y="574" text-anchor="middle" class="sm">strongest direct project evidence</text>
<rect x="518" y="405" width="405" height="190" rx="13" class="violet"/><text x="720" y="448" text-anchor="middle" class="h">Garmin family evidence</text><text x="720" y="486" text-anchor="middle" class="t">period evaluation material</text><text x="720" y="516" text-anchor="middle" class="t">OEM G900X/G950 architecture</text><text x="720" y="546" text-anchor="middle" class="t">configuration / acceptance review</text><text x="720" y="574" text-anchor="middle" class="sm">no generic diagram is relabelled as wiring</text>
<rect x="976" y="405" width="405" height="190" rx="13" class="amber"/><text x="1178" y="448" text-anchor="middle" class="h">G3X comparison evidence</text><text x="1178" y="486" text-anchor="middle" class="t">candidate capability comparison</text><text x="1178" y="516" text-anchor="middle" class="t">HMI / support / integration criteria</text><text x="1178" y="546" text-anchor="middle" class="t">never assigned flight verification</text><text x="1178" y="574" text-anchor="middle" class="sm">explicit comparison-only identity</text>
<rect x="150" y="680" width="1140" height="130" rx="14" class="slate"/><text x="720" y="720" text-anchor="middle" class="h">Configuration-control rule</text><text x="720" y="755" text-anchor="middle" class="t">Requirements, interfaces, discrepancies and test results belong only to the configuration in which they are evidenced.</text><text x="720" y="786" text-anchor="middle" class="t">Unknown LRU detail, software state or final closure remains unknown rather than inferred from another configuration.</text></svg>