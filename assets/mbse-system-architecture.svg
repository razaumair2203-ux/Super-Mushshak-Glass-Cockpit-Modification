<rect width="1440" height="920" fill="white"/><text x="40" y="52" class="title">Glass-Cockpit Retrofit — Logical System Architecture</text><text x="40" y="82" class="sub">Aircraft-level logical architecture showing engineering domains and interfaces; installation detail remains controlled.</text>
